<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Se reemplaza con --base-href al compilar (en GitHub Pages es /nombre-del-repo/) -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Rompecabezas deslizante (15-Puzzle) hecho en Flutter. Se instala y funciona sin conexión.">
  <meta name="theme-color" content="#6C4CE0">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="15-Puzzle">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>15-Puzzle Flutter</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F1ECFF; }
    @media (prefers-color-scheme: dark) { html, body { background: #1B1531; } }
    #loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      transition: opacity .3s ease;
    }
    #loader img { width: 96px; height: 96px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.9); opacity: .7; } }
  </style>
</head>
<body>
  <div id="loader"><img src="icons/Icon-192.png" alt="Cargando"></div>

  <script>
    // Service worker propio (web/sw.js): guarda la app en cache para que
    // funcione sin conexion. La lista de archivos la completa
    // tool/pwa/generate_sw.js despues de flutter build web.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('No se pudo registrar el service worker', err);
        });
      });
    }

    // Quita el logo de carga cuando Flutter pinta su primer frame.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      if (!loader) return;
      loader.style.opacity = '0';
      setTimeout(function () { loader.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
